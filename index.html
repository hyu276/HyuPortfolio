<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="HYU Portfolio" id="meta-description" />
  <title>HYU Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--accent:#111827;--ink:#111827;--muted:#5f6877;--line:#d8dee7;--paper:#fff;--canvas:#eef1f5;--soft:#f7f8fa;--rail:#0e1726}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas);line-height:1.55}a{color:inherit}.shell{min-height:100vh}.rail{position:fixed;inset:0 auto 0 0;width:270px;background:var(--rail);color:#fff;padding:34px 26px;display:flex;flex-direction:column;z-index:30}.brand{display:flex;align-items:center;gap:13px;margin-bottom:30px}.brand-mark{width:42px;height:42px;border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;font-weight:800;letter-spacing:.08em}.brand-copy strong{display:block;font-size:15px}.brand-copy span{font-size:11px;opacity:.62;letter-spacing:.12em}.avatar-wrap{width:132px;height:158px;border-radius:4px;overflow:hidden;background:#263248;margin:0 auto 22px;border:1px solid rgba(255,255,255,.22)}.avatar-wrap img{width:100%;height:100%;object-fit:cover}.avatar-fallback{width:100%;height:100%;display:grid;place-items:center;font-size:38px;font-weight:800;letter-spacing:.06em;color:#d8e2f1}.rail-name{text-align:center;font-size:22px;font-weight:800;line-height:1.15}.rail-title{text-align:center;font-size:12px;color:#bdc8d8;margin-top:8px}.rail nav{margin-top:28px;border-top:1px solid rgba(255,255,255,.12)}.rail nav a{display:block;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1);text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#cbd5e1;transition:.2s}.rail nav a:hover,.rail nav a.active{color:#fff;padding-left:7px}.rail-footer{margin-top:auto;font-size:11px;color:#9ca8bb}.rail-footer a{display:inline-block;color:white;text-decoration:none;margin-top:8px}.main{margin-left:270px;padding:28px}.paper{max-width:1030px;margin:0 auto;background:var(--paper);box-shadow:0 12px 36px rgba(18,31,53,.08);min-height:calc(100vh - 56px);padding:45px 50px 60px}.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:34px;padding-bottom:25px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--muted);margin-bottom:8px}.hero h1{font-size:38px;line-height:1.05;margin:0 0 9px;letter-spacing:-.04em}.hero .role{font-size:16px;font-weight:700;color:var(--accent)}.hero p{margin:16px 0 0;color:#364152;max-width:680px}.contact-grid{font-size:12px;border-left:1px solid var(--line);padding-left:22px}.contact-row{display:grid;grid-template-columns:62px 1fr;gap:8px;margin-bottom:8px}.contact-row b{font-size:10px;letter-spacing:.06em;text-transform:uppercase}.contact-row span,.contact-row a{overflow-wrap:anywhere;color:#334155;text-decoration:none}.availability{display:inline-flex;margin-top:10px;padding:5px 8px;border:1px solid var(--line);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.section{padding-top:28px}.section-heading{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:18px}.section-heading h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.08em}.section-heading span{font-size:10px;color:var(--muted)}.highlights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.highlight{border:1px solid var(--line);padding:14px 15px;background:var(--soft)}.highlight .label{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted)}.highlight .value{font-size:19px;font-weight:800;margin:3px 0}.highlight .note{font-size:11px;color:#566173}.timeline-item{display:grid;grid-template-columns:115px 1fr;gap:20px;padding:0 0 22px;margin-bottom:22px;border-bottom:1px solid #e8ebef}.timeline-item:last-child{border-bottom:0}.dates{font-size:11px;color:var(--muted);font-weight:600;padding-top:2px}.entry-head{display:flex;gap:20px;justify-content:space-between}.entry-head h3{font-size:15px;margin:0 0 2px}.entry-head .role{font-size:12px;font-weight:700;color:#293548}.entry-head .where{font-size:11px;color:var(--muted);white-space:nowrap}.entry-summary{font-size:12px;color:#435063;margin:10px 0}.bullets{margin:8px 0 0;padding-left:16px;font-size:12px}.bullets li{margin:5px 0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:9px;padding:4px 7px;border:1px solid var(--line);background:#fff;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:#5b6573}.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.project{border:1px solid var(--line);background:#fff;overflow:hidden}.project-image{height:155px;background:#e9edf3;display:grid;place-items:center;color:#8490a2;font-size:11px}.project-image img{width:100%;height:100%;object-fit:cover}.project-body{padding:15px}.project h3{font-size:14px;margin:0}.project .sub{font-size:10px;font-weight:700;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}.project p{font-size:11.5px;color:#4f5a6b;margin:10px 0}.project-links{display:flex;gap:12px;margin-top:11px}.project-links a{font-size:10px;font-weight:800;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px}.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 28px}.skill-row{display:grid;grid-template-columns:120px 1fr 28px;gap:10px;align-items:center;font-size:11px}.bar{height:5px;background:#e5e9ef;position:relative}.bar i{position:absolute;inset:0 auto 0 0;width:var(--level);background:var(--accent)}.skill-cat{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.edu-item{display:grid;grid-template-columns:115px 1fr;gap:20px;padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid #e8ebef}.edu-item h3{font-size:14px;margin:0 0 2px}.edu-meta{font-size:11px;color:#536074}.empty{padding:18px;border:1px dashed #cfd6df;color:#7a8594;font-size:11px;background:#fafbfc}.error{margin:0 auto 16px;max-width:1030px;background:#fff5f5;border:1px solid #fecaca;color:#991b1b;padding:12px 14px;font-size:12px;display:none}.mobile-top{display:none}.loading{position:fixed;inset:0;background:rgba(238,241,245,.9);z-index:100;display:grid;place-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#4b5563}.loading.hidden{display:none}
    @media(max-width:900px){.rail{display:none}.mobile-top{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;background:#0e1726;color:#fff;padding:12px 16px}.mobile-top strong{font-size:13px}.mobile-top button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;padding:6px 9px}.mobile-menu{display:none;position:fixed;inset:49px 0 auto 0;background:#0e1726;padding:8px 16px 14px;z-index:39}.mobile-menu.open{display:block}.mobile-menu a{display:block;color:#d7dfeb;text-decoration:none;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.main{margin-left:0;padding:0}.paper{box-shadow:none;padding:30px 22px}.hero{grid-template-columns:1fr}.contact-grid{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.projects,.highlights,.skills{grid-template-columns:1fr}.timeline-item,.edu-item{grid-template-columns:1fr;gap:6px}.entry-head{display:block}.entry-head .where{margin-top:4px}.skill-row{grid-template-columns:100px 1fr 28px}}
    @media print{body{background:#fff}.rail,.mobile-top,.mobile-menu,.loading{display:none!important}.main{margin:0;padding:0}.paper{max-width:none;box-shadow:none;padding:12mm}.section{break-inside:avoid}.project,.timeline-item,.edu-item{break-inside:avoid}}
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading portfolio…</div>
  <header class="mobile-top"><strong id="mobile-name">HYU</strong><button id="menu-btn" aria-label="Toggle navigation">Menu</button></header>
  <div class="mobile-menu" id="mobile-menu"></div>
  <div class="shell">
    <aside class="rail">
      <div class="brand"><div class="brand-mark">HY</div><div class="brand-copy"><strong>HYU Portfolio</strong><span>ONLINE CV</span></div></div>
      <div class="avatar-wrap" id="avatar-wrap"><div class="avatar-fallback">HY</div></div>
      <div class="rail-name" id="rail-name">HYU</div><div class="rail-title" id="rail-title">Portfolio</div>
      <nav id="rail-nav"></nav>
      <div class="rail-footer"><span id="updated-text"></span><br><a href="#" id="cv-link" hidden>Download CV ↗</a></div>
    </aside>
    <main class="main">
      <div class="error" id="error-box"></div>
      <article class="paper">
        <section class="hero" id="about">
          <div><div class="eyebrow" id="eyebrow">PERSONAL PORTFOLIO</div><h1 id="full-name">HYU</h1><div class="role" id="hero-title">Portfolio / Curriculum Vitae</div><p id="summary"></p></div>
          <div class="contact-grid" id="contact-grid"></div>
        </section>
        <section class="section" id="highlights"><div class="section-heading"><h2>Profile Highlights</h2><span>At a glance</span></div><div class="highlights" id="highlights-list"></div></section>
        <div id="dynamic-sections"></div>
        <section class="section" id="projects"><div class="section-heading"><h2>Selected Projects</h2><span>Work & case studies</span></div><div class="projects" id="projects-list"></div></section>
        <section class="section" id="skills"><div class="section-heading"><h2>Skills</h2><span>Core capabilities</span></div><div class="skills" id="skills-list"></div></section>
        <section class="section" id="education"><div class="section-heading"><h2>Education</h2><span>Academic background</span></div><div id="education-list"></div></section>
      </article>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL='https://zkrhwqgmynbbmoktokdq.supabase.co';
    const SUPABASE_KEY='sb_publishable_Fqcxk9-U1qalClQZjKcrhA_U822LTIq';
    const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const $=s=>document.querySelector(s);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const safeUrl=v=>{try{const u=new URL(v);return ['http:','https:','mailto:','tel:'].includes(u.protocol)?u.href:''}catch{return ''}};
    const empty=msg=>`<div class="empty">${esc(msg)}</div>`;
    let sectionNav=[['about','About'],['projects','Projects'],['skills','Skills'],['education','Education']];
    function contactRow(label,value,href=''){if(!value)return'';const url=href?safeUrl(href):'';return `<div class="contact-row"><b>${esc(label)}</b>${url?`<a href="${esc(url)}" target="_blank" rel="noreferrer">${esc(value)}</a>`:`<span>${esc(value)}</span>`}</div>`}
    function renderNav(){const html=sectionNav.map(([id,label])=>`<a href="#${id}">${label}</a>`).join('');$('#rail-nav').innerHTML=html;$('#mobile-menu').innerHTML=html}
    function setAvatar(url,name){const wrap=$('#avatar-wrap');if(url&&safeUrl(url)){wrap.innerHTML=`<img src="${esc(safeUrl(url))}" alt="${esc(name)}">`}else{wrap.innerHTML=`<div class="avatar-fallback">${esc((name||'HY').split(/\s+/).map(x=>x[0]).slice(-2).join('').toUpperCase())}</div>`}}
    async function load(){try{
      const queries=await Promise.all([
        db.from('portfolio_profile').select('*').eq('id',1).maybeSingle(),
        db.from('portfolio_settings').select('*').eq('id',1).maybeSingle(),
        db.from('portfolio_highlights').select('*').eq('visible',true).order('sort_order'),
        db.from('portfolio_sections').select('*').eq('visible',true).order('sort_order').order('id'),
        db.from('portfolio_section_items').select('*').eq('visible',true).order('sort_order').order('id'),
        db.from('portfolio_projects').select('*').eq('visible',true).order('featured',{ascending:false}).order('sort_order'),
        db.from('portfolio_skills').select('*').eq('visible',true).order('sort_order'),
        db.from('portfolio_education').select('*').eq('visible',true).order('sort_order')
      ]);
      const err=queries.find(q=>q.error)?.error;if(err)throw err;
      const [pr,st,hi,secs,sectionItems,pj,sk,ed]=queries.map(q=>q.data);const p=pr||{},s=st||{};
      document.documentElement.style.setProperty('--accent',s.accent_color||'#111827');document.title=`${p.full_name||'HYU'} — Portfolio`;$('#meta-description').setAttribute('content',s.meta_description||'HYU Portfolio');
      $('#rail-name').textContent=$('#mobile-name').textContent=$('#full-name').textContent=p.full_name||'HYU';$('#rail-title').textContent=$('#hero-title').textContent=p.title||'Portfolio';$('#eyebrow').textContent=p.eyebrow||'PERSONAL PORTFOLIO';$('#summary').textContent=p.summary||'';setAvatar(p.avatar_url,p.full_name);
      const cv=$('#cv-link');if(s.show_cv&&safeUrl(s.cv_url)){cv.href=safeUrl(s.cv_url);cv.hidden=false}else cv.hidden=true;$('#updated-text').textContent=s.last_updated_text?`Updated ${s.last_updated_text}`:'';
      $('#contact-grid').innerHTML=contactRow('Email',p.email,p.email?`mailto:${p.email}`:'')+contactRow('Phone',p.phone,p.phone?`tel:${p.phone}`:'')+contactRow('Location',p.location)+contactRow('Website',p.website_url,p.website_url)+contactRow('LinkedIn',p.linkedin_url,p.linkedin_url)+contactRow('GitHub',p.github_url,p.github_url)+(p.availability?`<div class="availability">${esc(p.availability)}</div>`:'');
      $('#highlights-list').innerHTML=hi.length?hi.map(x=>`<div class="highlight"><div class="label">${esc(x.label)}</div><div class="value">${esc(x.value)}</div><div class="note">${esc(x.note)}</div></div>`).join(''):empty('Add profile highlights from the admin dashboard.');
      const itemHtml=x=>`<article class="timeline-item"><div class="dates">${esc(x.start_label)}${x.end_label?` — ${esc(x.end_label)}`:''}</div><div><div class="entry-head"><div><h3>${esc(x.company)}</h3><div class="role">${esc(x.role)}</div></div><div class="where">${esc(x.location)}</div></div>${x.summary?`<div class="entry-summary">${esc(x.summary)}</div>`:''}${(x.achievements||[]).length?`<ul class="bullets">${x.achievements.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}${(x.technologies||[]).length?`<div class="chips">${x.technologies.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div>`:''}</div></article>`;
      $('#dynamic-sections').innerHTML=(secs||[]).map(sec=>{const rows=(sectionItems||[]).filter(x=>String(x.section_id)===String(sec.id));return `<section class="section" id="section-${sec.id}"><div class="section-heading"><h2>${esc(sec.name)}</h2><span>${esc(sec.subtitle||'Selected entries')}</span></div><div>${rows.length?rows.map(itemHtml).join(''):empty('No entries in this section yet.')}</div></section>`}).join('');
      sectionNav=[['about','About'],...(secs||[]).map(sec=>[`section-${sec.id}`,sec.nav_label||sec.name]),['projects','Projects'],['skills','Skills'],['education','Education']];
      $('#projects-list').innerHTML=pj.length?pj.map(x=>`<article class="project"><div class="project-image">${x.image_url&&safeUrl(x.image_url)?`<img src="${esc(safeUrl(x.image_url))}" alt="${esc(x.title)}">`:'Project image'}</div><div class="project-body"><h3>${esc(x.title)}</h3><div class="sub">${esc(x.subtitle)}</div><p>${esc(x.description)}</p><div class="chips">${(x.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><div class="project-links">${x.live_url&&safeUrl(x.live_url)?`<a href="${esc(safeUrl(x.live_url))}" target="_blank" rel="noreferrer">Live ↗</a>`:''}${x.repo_url&&safeUrl(x.repo_url)?`<a href="${esc(safeUrl(x.repo_url))}" target="_blank" rel="noreferrer">Repository ↗</a>`:''}</div></div></article>`).join(''):empty('Add projects from the admin dashboard.');
      $('#skills-list').innerHTML=sk.length?sk.map(x=>`<div class="skill-row"><div><div>${esc(x.name)}</div><div class="skill-cat">${esc(x.category)}</div></div><div class="bar"><i style="--level:${Math.min(100,Math.max(0,Number(x.level)||0))}%"></i></div><b>${esc(x.level)}%</b></div>`).join(''):empty('Add skills from the admin dashboard.');
      $('#education-list').innerHTML=ed.length?ed.map(x=>`<article class="edu-item"><div class="dates">${esc(x.start_label)}${x.end_label?` — ${esc(x.end_label)}`:''}</div><div><h3>${esc(x.school)}</h3><div class="edu-meta">${esc([x.degree,x.field,x.gpa&&`GPA ${x.gpa}`].filter(Boolean).join(' · '))}</div>${(x.highlights||[]).length?`<ul class="bullets">${x.highlights.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}</div></article>`).join(''):empty('Add education from the admin dashboard.');
      renderNav();
      const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('#rail-nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===`#${e.target.id}`))}}),{rootMargin:'-35% 0px -55%'});sectionNav.forEach(([id])=>{const el=document.getElementById(id);if(el)observer.observe(el)});
    }catch(e){$('#error-box').style.display='block';$('#error-box').textContent=`Could not load portfolio data: ${e.message||e}`;renderNav()}finally{$('#loading').classList.add('hidden')}}
    $('#menu-btn').addEventListener('click',()=>$('#mobile-menu').classList.toggle('open'));$('#mobile-menu').addEventListener('click',()=>$('#mobile-menu').classList.remove('open'));load();
  </script>
</body>
</html>
